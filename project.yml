name: FastBudo
options:
  deploymentTarget:
    macOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  FastBudo:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: .build/engine/7zz
        buildPhase: resources
      - path: .build/engine/7z.so
        buildPhase: resources
      - path: .build/engine/ArchiveBridge
        buildPhase: resources
      - path: Vendor/7zip/LICENSE.txt
        buildPhase: resources
    dependencies:
      - target: FastBudoFinder
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fastbudo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  FastBudoFinder:
    type: app-extension
    platform: macOS
    sources: [FinderExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.fastbudo.app.finder
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  FastBudoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: FastBudo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FastBudo:
    build:
      targets:
        FastBudo: all
    test:
      targets: [FastBudoTests]
